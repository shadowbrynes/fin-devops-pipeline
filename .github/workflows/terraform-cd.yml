name: "Terraform & App CD"

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "terraform/**"
      - "ansible/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::107203103587:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve

  deploy-application:
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::107203103587:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Set up SSH Key for Ansible
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install Ansible Dependencies
        run: |
          pip install ansible boto3 botocore

      - name: Run Ansible Playbook
        run: |
          cd ansible
          ansible-playbook -i inventory_aws_ec2.yml deploy-app.yml --extra-vars "app_version=v1"
