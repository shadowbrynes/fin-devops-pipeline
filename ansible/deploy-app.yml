---
- name: Deploy Dockerized Cards Microservice to ASG Nodes
  hosts: role_cards_backend
  become: true
  vars:
    ecr_url: "107203103587.dkr.ecr.us-east-1.amazonaws.com"
    aws_region: "us-east-1"

  tasks:
    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started

    - name: Authenticate Docker with Amazon ECR
      ansible.builtin.shell: |
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_url }}
      environment:
        AWS_DEFAULT_REGION: "{{ aws_region }}"

    - name: Stop and remove existing application container (if running)
      community.docker.docker_container:
        name: cards-service
        state: absent

    - name: Pull updated image from ECR
      community.docker.docker_image:
        name: "{{ ecr_url }}/cards-service:{{ app_version }}"
        source: pull
        force_source: true

    - name: Run fresh Cards Microservice container
      community.docker.docker_container:
        name: cards-service
        image: "{{ ecr_url }}/cards-service:{{ app_version }}"
        state: started
        restart_policy: always
        published_ports:
          - "8085:8081"
          - "8081:8081"

    - name: Verify API health endpoint
      ansible.builtin.uri:
        url: "http://localhost:8085/swagger-ui/index.html"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 15
      delay: 5
